# Datheon Python + FastAPI Backend Development Internship
# Docker Compose Orchestration File
# ==============================================================================

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datheon_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Datheon BookStore API
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=sqlite+aiosqlite:////app/data/datheon_bookstore.db
      - JWT_SECRET_KEY=production_docker_jwt_secret_key_minimum_32_characters_long_12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - RATE_LIMIT_LOGIN=5/minute
      - RATE_LIMIT_REGISTER=5/minute
      - RATE_LIMIT_DEFAULT=100/minute
    volumes:
      # Persistent host volume mount for SQLite database persistence
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
